apiVersion: apps/v1
kind: Deployment
metadata:
  name: notify-lambda
  namespace: oficina
  labels:
    app: notify-lambda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notify-lambda
  template:
    metadata:
      labels:
        app: notify-lambda
    spec:
      containers:
        - name: notify-lambda
          image: oficina-notify-lambda:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: MAIL_HOST
              value: mailhog
            - name: MAIL_PORT
              value: "1025"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: notify-lambda
  namespace: oficina
spec:
  selector:
    app: notify-lambda
  ports:
    - port: 8080
      targetPort: 8080
